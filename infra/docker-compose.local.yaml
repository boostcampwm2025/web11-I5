services:
  db:
    container_name: malmanhae-db
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - ../apps/api/.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - malmanhae-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    container_name: malmanhae-api
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../apps/api/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - malmanhae-network

  prometheus:
    container_name: malmanhae-prometheus
    image: prom/prometheus:v3.8.1
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - api
    networks:
      - malmanhae-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    container_name: malmanhae-grafana
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    depends_on:
      - prometheus
    networks:
      - malmanhae-network

  loki:
    container_name: malmanhae-loki
    image: grafana/loki:2.9.4
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki-config.local.yaml:/etc/loki/local-config.yaml:ro
    networks:
      - malmanhae-network

  promtail:
    container_name: malmanhae-promtail
    image: grafana/promtail:2.9.4
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yaml:/etc/promtail/config.yaml:ro
      - promtail-positions:/var/lib/promtail
    depends_on:
      - loki
    networks:
      - malmanhae-network

  web:
    container_name: malmanhae-web
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file:
      - ../apps/web/.env
    depends_on:
      - api
    networks:
      - malmanhae-network

  nginx:
    container_name: malmanhae-nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    networks:
      - malmanhae-network

networks:
  malmanhae-network:
    driver: bridge

volumes:
  pgdata:
  promtail-positions:
