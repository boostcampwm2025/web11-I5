x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    container_name: malmanhae-db
    image: postgres:15-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: malmanhae
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  api:
    container_name: malmanhae-api
    image: ${DOCKERHUB_USERNAME}/malmanhae-api:latest
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      PORT: 8000
      # Database
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: malmanhae
      # Gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_GRADING_MODEL: gemini-2.0-flash
      GEMINI_DEFAULT_MODEL: gemini-2.0-flash
      # NCloud STT
      NCLOUD_CLOVA_SPEECH_INVOKE_URL: ${NCLOUD_CLOVA_SPEECH_INVOKE_URL}
      NCLOUD_CLOVA_SPEECH_SECRET_KEY: ${NCLOUD_CLOVA_SPEECH_SECRET_KEY}
      STT_CALLBACK_URL: ${STT_CALLBACK_URL}
      # NCloud Object Storage
      NCLOUD_OBJECT_STORAGE_ENDPOINT: ${NCLOUD_OBJECT_STORAGE_ENDPOINT}
      NCLOUD_OBJECT_STORAGE_REGION: ${NCLOUD_OBJECT_STORAGE_REGION}
      NCLOUD_OBJECT_STORAGE_ACCESS_KEY: ${NCLOUD_OBJECT_STORAGE_ACCESS_KEY}
      NCLOUD_OBJECT_STORAGE_SECRET_KEY: ${NCLOUD_OBJECT_STORAGE_SECRET_KEY}
      NCLOUD_OBJECT_STORAGE_BUCKET: ${NCLOUD_OBJECT_STORAGE_BUCKET}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # Mail
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  prometheus:
    container_name: malmanhae-prometheus
    image: prom/prometheus:v3.8.1
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    depends_on:
      - api
    networks:
      - app-network

  grafana:
    container_name: malmanhae-grafana
    image: grafana/grafana:12.3.1
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - ./grafana-datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
    depends_on:
      - prometheus
    networks:
      - app-network

  loki:
    container_name: malmanhae-loki
    image: grafana/loki:2.9.4
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3100:3100"
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/loki
      - loki-wal:/wal
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
    networks:
      - app-network

  promtail:
    container_name: malmanhae-promtail
    image: grafana/promtail:2.9.4
    restart: unless-stopped
    logging: *default-logging
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail-config.yaml:/etc/promtail/config.yaml:ro
      - promtail-positions:/var/lib/promtail
    depends_on:
      - loki
    networks:
      - app-network

  web:
    container_name: malmanhae-web
    image: ${DOCKERHUB_USERNAME}/malmanhae-web:latest
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      API_URL: http://api:8000
      BOOSTAD_BLOG_KEY: ${BOOSTAD_BLOG_KEY}
    depends_on:
      - api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
  loki-data:
  loki-wal:
  promtail-positions:
