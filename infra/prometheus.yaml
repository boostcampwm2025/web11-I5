global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1) Docker 컨테이너 안에서 돌아가는 NestJS API (prod 또는 local-docker 환경)
  - job_name: 'nestjs-api-docker'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'malmanhae-api:8000'

  # 2) 호스트(macOS)에서 콘솔로 실행하는 NestJS API (local 개발용)
  #    Docker 컨테이너(prometheus) 입장에서 host.docker.internal 로 접근 가능
  - job_name: 'nestjs-api-host'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'host.docker.internal:8000'

