server:
  http_listen_port: 9080
  grpc_listen_port: 0

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: malmanhae

positions:
  filename: /tmp/positions.yaml

scrape_configs:
  - job_name: docker-container-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker-logs
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      # Parse Docker JSON log format: {"log":"...","stream":"stdout/stderr","attrs":{...},"time":"..."}
      - json:
          expressions:
            output: log
            stream: stream
            attrs: attrs
            timestamp: time
      # Extract container tag from attrs if available (Docker may include container name in attrs.tag)
      - json:
          expressions:
            tag: attrs.tag
          source: attrs
      # Set stream as label for filtering stdout/stderr
      - labels:
          stream:
      # Extract container name from tag if available, otherwise will use container_id from relabel_configs
      - regex:
          expression: '(?P<container_name>.*)'
          source: tag
      # Output the actual log content
      - output:
          source: output
    relabel_configs:
      # Extract container_id from log file path
      - source_labels: ['__path__']
        regex: '/var/lib/docker/containers/([a-f0-9]{64})/([a-f0-9]{64})-json.log'
        target_label: 'container_id'
        replacement: '${1}'
      # Use container_name from tag if available, otherwise use container_id prefix
      - source_labels: ['container_name', 'container_id']
        regex: '(.+);.*'
        target_label: 'container'
        replacement: '${1}'
      - source_labels: ['container_id']
        regex: '(.+)'
        target_label: 'container'
        replacement: '${1}'
      # Set default labels
      - target_label: 'service'
        replacement: 'unknown'
      - target_label: 'compose_project'
        replacement: 'malmanhae'

